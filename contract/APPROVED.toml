# Braid's approved dependency edges — the contract for INV-DEP-EDGE-OWNED.
#
# Read by `lgwks_deps` (logicalworks-crates). A crate reaches this file only after the ladder in
# `lgwks-deps tiers` has been climbed and every rung above a dependency was
# rejected for a stated reason. Adding a block here is an approval; the commit
# that adds it is the signature. The process is `docs/ADMISSION.md`.
#
# ELIMINATE and CONSOLIDATE crates never appear here. They become a module in
# `lgwks_std` (logicalworks-crates) instead, which is why `tier` admits only
# `boundary` and `vendor`.

[policy]
enforce = true
repository = "https://github.com/srinji-kaggss/Braid"

[[approved]]
crate = "serde"
tier = "boundary"
version = "^1.0.228"
owner = "braid-capability"
capability = "wire.capability-token.no-std"
source = "registry"
allowed_consumers = "braid-capability"
allowed_kinds = "normal"
reason = "No-std derive support preserves the protocol token without importing the std-plus facade."
approved_by = "Director"
approved_on = "2026-08-30"
review = "https://github.com/srinji-kaggss/Braid/issues/91"

[[approved]]
crate = "lgwks_bot"
tier = "boundary"
version = "^0.1.1"
owner = "braid-integrate"
capability = "bot.actor-verbs.observe-execute"
source = "git"
allowed_consumers = "braid-integrate"
allowed_kinds = "normal"
reason = "Capability-gated Observe/Evaluate/Execute/Query actor verbs have no std equivalent; estate source of truth moved to logicalworks-crates with versions unchanged."
approved_by = "Director"
approved_on = "2026-09-03"
review = "https://github.com/srinji-kaggss/logicalworks-crates"

[[approved]]
crate = "blake3"
tier = "boundary"
version = "^1.8.5"
owner = "braid-ir"
capability = "protocol.canonical-cid"
source = "registry"
allowed_consumers = "braid-ir, braid-verify"
allowed_kinds = "normal"
reason = "Independent canonical CID production and verification require identical BLAKE3 protocol bytes."
approved_by = "Director"
approved_on = "2026-08-30"
review = "https://github.com/srinji-kaggss/Braid/issues/91"

[[approved]]
crate = "ed25519-dalek"
tier = "boundary"
version = "^2.2"
owner = "braid-governance"
capability = "governance.signature.ed25519"
source = "registry"
allowed_consumers = "braid-governance"
allowed_kinds = "normal"
reason = "Ed25519 signature verification requires audited curve arithmetic absent from the standard library."
approved_by = "Director"
approved_on = "2026-08-30"
review = "https://github.com/srinji-kaggss/Braid/issues/91"

[[approved]]
crate = "proptest"
tier = "boundary"
version = "^1.6.0"
owner = "braid-test-support"
capability = "test.property-generation"
source = "registry"
allowed_consumers = "braid-test-support"
allowed_kinds = "normal"
reason = "Shrinking property generators provide falsification coverage unavailable in the standard test harness."
approved_by = "Director"
approved_on = "2026-08-30"
review = "https://github.com/srinji-kaggss/Braid/issues/91"
