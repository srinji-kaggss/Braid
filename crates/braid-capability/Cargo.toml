[package]
name = "braid-capability"
version = "0.1.0"
edition = "2024"
description = "Capability token — the closed permission vocabulary boundary for the Braid global IR (ADR-088 D3, D31)"
repository = "https://github.com/srinji-kaggss/Braid"
