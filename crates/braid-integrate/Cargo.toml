[package]
name = "braid-integrate"
version = "0.1.0"
edition = "2024"
description = "Advisor CLI that graphs an arbitrary repo and proposes lgwks_std / lgwks_bot seams — suggests-for-approval, never auto-mutates (read-only unless --apply)"
repository = "https://github.com/srinji-kaggss/Braid"
homepage = "https://github.com/srinji-kaggss/Braid"
license = "MIT"
rust-version = "1.98"

[[bin]]
name = "braid-integrate"
path = "src/main.rs"

[dependencies]
braid-runtime = { workspace = true }
lgwks_std = { workspace = true, features = ["json"] }
lgwks_deps = { workspace = true }
lgwks_bot = { workspace = true }
