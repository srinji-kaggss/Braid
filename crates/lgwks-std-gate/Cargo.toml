[package]
name = "lgwks_std_gate"
description = "Refuses to build a crate whose dependencies are not human-approved."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

# The gate consumes JSON only through the estate facade it enforces. Depending
# on serde_json directly here would make the checker its own first bypass.
[dependencies]
lgwks_std = { workspace = true, features = ["json"] }

[[bin]]
name = "lgwks-gate"
path = "src/main.rs"

[lib]
name = "lgwks_std_gate"
path = "src/lib.rs"
