[package]
name = "lgwks_std_gate"
description = "Refuses to build a crate whose dependencies are not human-approved."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# INV-STDPLUS-ZERO-DEPS applies to the gate itself, and more strictly: a gate
# that pulled in a TOML parser would be admitting an unapproved dependency in
# order to check for unapproved dependencies. Both readers here are
# line-oriented and refuse what they cannot parse.
[dependencies]

[[bin]]
name = "lgwks-gate"
path = "src/main.rs"

[lib]
name = "lgwks_std_gate"
path = "src/lib.rs"
