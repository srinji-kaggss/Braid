# Braid CI — adapted from keel's six-tier verification stack.
#
# Portable structure: concurrency control, fail-closed stack position,
# immutable action pins, build-once-share, cargo test --locked,
# cargo clippy --locked -- -D warnings, and rustfmt.
# Keel-specific tiers (Buck2, Kani, loom, MC/DC, mutation, semantic review)
# are not ported — Braid has no gate binary. They arrive when keel-ci-plan
# gains a Braid target.
name: Braid CI

on:
  push:
    branches: [main]
  # No branches filter on pull_request. A filter matches the PR's BASE ref,
  # so `branches: [main]` silently skips stacked PRs whose base is another
  # review branch. An unfiltered trigger has no such hole.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# ONE in-flight run per PR. Keyed on PR number, not ref, so stacked PRs
# never cancel each other. Push to main is never cancelled — it is the
# record of what landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  # ── Stack position ────────────────────────────────────────────────────────
  #
  # A stacked PR whose base is still an open PR is refused. Four runners
  # cannot serve nine PRs at once, and reviewing against a base that changes
  # the instant the bottom one lands proves nothing.
  stack-position:
    name: Stack
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Refuse a PR whose base is itself an open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "OK   $EVENT carries no stack position; the tiers run."
            exit 0
          fi
          blocker="$(gh pr list --repo "$REPO" --state open --head "$BASE" --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"')"
          if [ -z "$blocker" ]; then
            echo "OK   base '$BASE' has no open pull request — bottom of stack."
            exit 0
          fi
          echo "FAIL This PR is not the bottom of its stack." >&2
          echo "     Base '$BASE' is still open: $blocker" >&2
          echo "     Merge $blocker first; this PR then becomes the bottom and runs." >&2
          exit 1

  # ── Orchestration policy ──────────────────────────────────────────────────
  ci-policy:
    name: CI policy
    needs: [stack-position]
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse fail-open workflow structure
        run: ./scripts/ci-policy-check.sh --self-test .github/workflows/ci.yml

  # ── Build ─────────────────────────────────────────────────────────────────
  #
  # Build once, share across jobs via the self-hosted filesystem. Downstream
  # jobs inherit the same CARGO_TARGET_DIR and find pre-built artifacts.
  # ── Failure policy ────────────────────────────────────────────────────────
  #
  # The estate audit found five intentionally discarded results. This turns the
  # discipline into an enforced ceiling rather than a remembered fact.
  swallow-budget:
    name: Swallow budget
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep swallowed results at or below five
        run: |
          set -eu
          count="$(grep -rc 'let _ = \|\.ok();' crates/ | awk -F: '{s+=$2} END{print s}')"
          echo "swallowed-results=$count ceiling=5"
          test "$count" -le 5

  build:
    name: Build
    needs: [stack-position, ci-policy, swallow-budget]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
      CARGO_BUILD_JOBS: "12"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clean shared target
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          mkdir -p "$CARGO_TARGET_DIR"

      - name: Verify lockfile is up-to-date
        run: |
          cargo metadata --locked >/dev/null || { echo 'Lockfile out of date: run cargo update --workspace and commit Cargo.lock' >&2; exit 1; }

      - name: Enforce dependency edge ownership
        run: cargo run --locked -p lgwks_std_gate --bin lgwks-gate -- check .

      - name: Build all workspace targets
        run: cargo test --workspace --all-targets --locked --no-run

  # ── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Tests ─────────────────────────────────────────────────────────────────
  tests:
    name: Tier 0 test
    needs: [build]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        run: cargo test --workspace --doc --locked

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Tier 0 clippy
    needs: [build]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clippy all workspace targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  lgwks-std-current-stable:
    name: lgwks-std current-stable Rust 1.98.0
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std-stable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Workspace test on current stable
        run: cargo test --workspace --all-targets

      - name: Workspace clippy on current stable
        run: cargo clippy --workspace --all-targets -- -D warnings

  lgwks-std-msrv:
    name: lgwks-std MSRV
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-msrv
    strategy:
      fail-fast: false
      matrix:
        msrv: ["1.98.0"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "${{ matrix.msrv }}"
          components: ""

      - name: Check lgwks-std feature matrix at MSRV
        run: |
          set -eu
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features hash --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features pattern --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features json --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features wire --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --all-features

      - name: Check lgwks-std-gate at MSRV
        run: cargo check --manifest-path crates/lgwks-std-gate/Cargo.toml --all-targets


  lgwks-std-contract-drift:
    name: lgwks-std contract drift checks
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std-contract
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate std+ contract alignment
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          manifest = Path("crates/lgwks-std/Cargo.toml")
          readme = Path("crates/lgwks-std/README.md")

          parsed = tomllib.loads(manifest.read_text(encoding="utf-8"))
          manifest_deps = set(parsed["dependencies"].keys())

          text = readme.read_text(encoding="utf-8")
          marker = "## Dependency philosophy"
          start = text.find(marker)
          if start == -1:
              raise SystemExit("README dependency philosophy section missing")

          section = text[start:start + 1800]
          readme_deps = set(re.findall(r"- \*\*([a-zA-Z0-9_]+)\*\*", section))

          missing_from_readme = sorted(manifest_deps - readme_deps)
          missing_from_manifest = sorted(readme_deps - manifest_deps)
          if missing_from_readme or missing_from_manifest:
              raise SystemExit(
                  f"Dependency contract drift detected. "
                  f"missing_from_readme={missing_from_readme}, "
                  f"missing_from_manifest={missing_from_manifest}"
              )

          package = parsed["package"]
          if package["repository"] != "https://github.com/srinji-kaggss/Braid":
              raise SystemExit(
                  f"Unexpected package repository URL: {package['repository']}"
              )
          PY

  lgwks-std-package-smoke:
    name: lgwks-std package smoke-test
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std-package
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run package smoke test
        run: ./scripts/lgwks-std-package-smoke.sh

  lgwks-std-consumption-contract:
    name: lgwks-std public consumption contract
    # Keep this job as an active regression gate for Braid consumption.
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure no in-repo path fallback for lgwks_std consumers
        run: |
          set -eu
          if rg 'lgwks_std\s*=\s*\{\s*path\s*=\s*"../lgwks-std"\s*\}' -g '*.toml' crates; then
            echo "Contract breach: path-based lgwks_std dependency remains." >&2
            exit 1
          fi
          if ! rg '^lgwks_std\s*=\s*\{\s*version\s*=\s*"0\.5\.1"\s*\}' -g '*.toml' Cargo.toml crates; then
            echo "Contract breach: workspace lgwks_std dependency pin missing or malformed." >&2
            exit 1
          fi
          if ! rg '^lgwks_std\s*=\s*\{\s*path\s*=\s*"crates/lgwks-std"\s*\}' -g '*.toml' Cargo.toml; then
            echo "Contract breach: local patch for in-repo lgwks_std is missing or malformed." >&2
            exit 1
          fi

  braid-contract-release:
    name: Braid contract release probe
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Regenerate the CMS registry deterministically
        run: ./scripts/braid-registry-export-check.sh

      - name: Prove malformed release revisions fail closed
        run: |
          set -eu
          if ./scripts/braid-release-probe.sh "file://${GITHUB_WORKSPACE}" not-a-commit; then
            echo "release probe accepted a malformed revision" >&2
            exit 1
          fi

      - name: Build a locked consumer from this exact Git commit
        run: ./scripts/braid-release-probe.sh "file://${GITHUB_WORKSPACE}" "$GITHUB_SHA"

  # ── std+ feature matrix ────────────────────────────────────────────────
  lgwks-std-feature-matrix:
    name: lgwks-std feature matrix
    needs: [stack-position, ci-policy]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all requested feature combinations
        run: |
          set -eu
          cargo test -p lgwks_std --no-default-features --all-targets
          cargo test -p lgwks_std --all-targets
          cargo test -p lgwks_std --features hash --no-default-features --all-targets
          cargo test -p lgwks_std --features pattern --no-default-features --all-targets
          cargo test -p lgwks_std --features json --no-default-features --all-targets
          cargo test -p lgwks_std --features wire --no-default-features --all-targets
          cargo test -p lgwks_std --all-features --all-targets

  # ── Cleanup ───────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup
    needs: [stack-position, ci-policy, swallow-budget, build, fmt, tests, clippy, lgwks-std-current-stable, lgwks-std-msrv, lgwks-std-contract-drift, lgwks-std-package-smoke, lgwks-std-consumption-contract, braid-contract-release, lgwks-std-feature-matrix]
    runs-on: self-hosted
    if: always()
    timeout-minutes: 5
    steps:
      - name: Remove shared target directory
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "invalid run id: $RUN_ID" >&2; exit 1 ;;
          esac
          root="/Users/srinji/.braid-ci/targets"
          for suffix in '' -std-stable -msrv -std-contract -std-package -std; do
            rm -rf -- "$root/${RUN_ID:?}${suffix}"
          done
