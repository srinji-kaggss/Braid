name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · test · lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: calibration (flight hours — external pre-validated vectors)
        run: cargo test -p braid-ir --test calibration

  cli-loop:
    name: scenario #12 + T12 widening gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build braid binary
        run: cargo build --release -p braid-cli
      # The human-reconstructable loop, driven through the real binary, with
      # every exit code asserted — including the manifest-widening gate firing
      # on a seeded widening (T12) and a laundering capsule rejected at taint.
      - name: CLI-only loop
        run: ./scripts/cli-loop.sh target/release/braid

  tier2-semantic:
    name: Keel safety-assurance floor (NotSlop)
    runs-on: self-hosted
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tier-1 evidence (cargo test + clippy)
        run: cargo test --workspace
      - name: Keel semantic floor
        env:
          KEEL_ROOT: ./keel
        run: ./scripts/keel-floor.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: braid-ci-evidence
          path: .ci-runs/
