# Braid CI — adapted from keel's six-tier verification stack.
#
# Portable structure: concurrency control, stack-position gate, change-scope,
# build-once-share, cargo test, cargo clippy -D warnings, rustfmt.
# Keel-specific tiers (Buck2, Kani, loom, MC/DC, mutation, semantic review)
# are not ported — Braid has no gate binary. They arrive when keel-ci-plan
# gains a Braid target.
name: Braid CI

on:
  push:
    branches: [main]
  # No branches filter on pull_request. A filter matches the PR's BASE ref,
  # so `branches: [main]` silently skips stacked PRs whose base is another
  # review branch. An unfiltered trigger has no such hole.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# ONE in-flight run per PR. Keyed on PR number, not ref, so stacked PRs
# never cancel each other. Push to main is never cancelled — it is the
# record of what landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  # ── Stack position ────────────────────────────────────────────────────────
  #
  # A stacked PR whose base is still an open PR is refused. Four runners
  # cannot serve nine PRs at once, and reviewing against a base that changes
  # the instant the bottom one lands proves nothing.
  stack-position:
    name: Stack
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Refuse a PR whose base is itself an open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "OK   $EVENT carries no stack position; the tiers run."
            exit 0
          fi
          blocker="$(gh pr list --repo "$REPO" --state open --head "$BASE" --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"' 2>/dev/null || true)"
          if [ -z "$blocker" ]; then
            echo "OK   base '$BASE' has no open pull request — bottom of stack."
            exit 0
          fi
          echo "FAIL This PR is not the bottom of its stack." >&2
          echo "     Base '$BASE' is still open: $blocker" >&2
          echo "     Merge $blocker first; this PR then becomes the bottom and runs." >&2
          exit 1

  # ── Scope ─────────────────────────────────────────────────────────────────
  scope:
    name: Scope
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scope base ref
        id: base
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide code vs docs-only
        id: scope
        run: |
          set -eu
          base="${{ steps.base.outputs.ref }}"
          changed="$(git diff --name-only "$base" -- '*.rs' '*.toml' '*.lock' | head -1)"
          if [ -n "$changed" ]; then
            echo "code_changed=yes" >> "$GITHUB_OUTPUT"
            echo "scope: code changed"
          else
            echo "code_changed=no" >> "$GITHUB_OUTPUT"
            echo "scope: docs-only"
          fi

  # ── Build ─────────────────────────────────────────────────────────────────
  #
  # Build once, share across jobs via the self-hosted filesystem. Downstream
  # jobs inherit the same CARGO_TARGET_DIR and find pre-built artifacts.
  # ── Failure policy ────────────────────────────────────────────────────────
  #
  # The estate audit found five intentionally discarded results. This turns the
  # discipline into an enforced ceiling rather than a remembered fact.
  swallow-budget:
    name: Swallow budget
    needs: [stack-position]
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Keep swallowed results at or below five
        run: |
          set -eu
          count="$(grep -rc 'let _ = \|\.ok();' crates/ | awk -F: '{s+=$2} END{print s}')"
          echo "swallowed-results=$count ceiling=5"
          test "$count" -le 5

  build:
    name: Build
    needs: [stack-position, scope, swallow-budget]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
      CARGO_BUILD_JOBS: "12"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Clean shared target
        run: |
          rm -rf "$CARGO_TARGET_DIR"
          mkdir -p "$CARGO_TARGET_DIR"

      - name: Build all workspace targets
        if: needs.scope.outputs.code_changed == 'yes'
        run: cargo test --workspace --all-targets --no-run

      - name: Build release bins (docs-only path)
        if: needs.scope.outputs.code_changed == 'no'
        run: cargo check --workspace

  # ── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    needs: [stack-position]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Tests ─────────────────────────────────────────────────────────────────
  tests:
    name: Tier 0 test
    needs: [build, scope]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run all workspace tests
        if: needs.scope.outputs.code_changed == 'yes'
        run: cargo test --workspace --all-targets

      - name: Doc tests
        if: needs.scope.outputs.code_changed == 'yes'
        run: cargo test --workspace --doc

      - name: Record docs-only N/A
        if: needs.scope.outputs.code_changed != 'yes'
        run: echo "scope docs-only — tests skipped (explicit N/A)"

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Tier 0 clippy
    needs: [build, scope]
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Clippy all workspace targets
        if: needs.scope.outputs.code_changed == 'yes'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Record docs-only N/A
        if: needs.scope.outputs.code_changed != 'yes'
        run: echo "scope docs-only — clippy skipped (explicit N/A)"

  lgwks-std-current-stable:
    name: lgwks-std current-stable Rust 1.98.0
    needs: [scope, stack-position]
    runs-on: self-hosted
    if: needs.scope.outputs.code_changed == 'yes'
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std-stable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Workspace test on current stable
        run: cargo test --workspace --all-targets

      - name: Workspace clippy on current stable
        run: cargo clippy --workspace --all-targets -- -D warnings

  lgwks-std-msrv:
    name: lgwks-std MSRV
    needs: [scope, stack-position]
    runs-on: self-hosted
    if: needs.scope.outputs.code_changed == 'yes'
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-msrv
    strategy:
      fail-fast: false
      matrix:
        msrv: ["1.97.0"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "${{ matrix.msrv }}"
          components: ""

      - name: Check lgwks-std feature matrix at MSRV
        run: |
          set -eu
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features hash --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features pattern --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features json --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --features wire --no-default-features
          cargo check --manifest-path crates/lgwks-std/Cargo.toml --all-targets --all-features

      - name: Check lgwks-std-gate at MSRV
        run: cargo check --manifest-path crates/lgwks-std-gate/Cargo.toml --all-targets

  # ── std+ feature matrix ────────────────────────────────────────────────
  lgwks-std-feature-matrix:
    name: lgwks-std feature matrix
    needs: [scope, stack-position]
    runs-on: self-hosted
    if: needs.scope.outputs.code_changed == 'yes'
    env:
      CARGO_TARGET_DIR: /Users/srinji/.braid-ci/targets/${{ github.run_id }}-std
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check all requested feature combinations
        run: |
          set -eu
          cargo test -p lgwks-std --no-default-features --all-targets
          cargo test -p lgwks-std --all-targets
          cargo test -p lgwks-std --features hash --no-default-features --all-targets
          cargo test -p lgwks-std --features pattern --no-default-features --all-targets
          cargo test -p lgwks-std --features json --no-default-features --all-targets
          cargo test -p lgwks-std --features wire --no-default-features --all-targets
          cargo test -p lgwks-std --all-features --all-targets

  # ── Cleanup ───────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup
    needs: [tests, clippy]
    runs-on: self-hosted
    if: always()
    timeout-minutes: 5
    steps:
      - name: Remove shared target directory
        run: rm -rf "/Users/srinji/.braid-ci/targets/${{ github.run_id }}"
