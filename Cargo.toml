[workspace]
members = [
    "crates/braid-integrate",
    "crates/braid-capability",
    "crates/braid-ir",
    "crates/braid-flow-ir",
    "crates/braid-flow-verify",
    "crates/braid-flow-plan",
    "crates/braid-vocab-cms",
    "crates/braid-vocab-js",
    "crates/braid-vocab-web",
    "crates/braid-verify",
    "crates/braid-render",
    "crates/braid-sdk",
    "crates/braid-cli",
    "crates/braid-elaborate-dsl",
    "crates/braid-elaborate-js",
    "crates/braid-project",
    "crates/braid-runtime",
    "crates/braid-governance",
    "crates/braid-vocab-rust",
    "crates/braid-manifest",
    "crates/braid-run",
    # std+ and its gate. Not `braid-*`: these carry a different authority from
    # the IR and the verifier — `lgwks_std` is the estate's one approved
    # non-`std` surface, and `lgwks_std_gate` enforces INV-DEP-REGISTERED, that
    # nothing outside `std` and `std+` compiles without a human's approval in
    # `contract/APPROVED.toml`. See `crates/lgwks-std/README.md`.
    "crates/lgwks-std",
    "crates/lgwks-bot",
    "crates/lgwks-std-gate",
]
resolver = "2"

# INV-NIGHTLY-ISOLATION — sandbox code may run on any toolchain it likes;
# keeping it out of the workspace keeps Cargo.lock and every member's
# rust-version honest at 1.98.
exclude = ["sandbox"]

# ─────────────────────────────────────────────────────────────────────────────
# Braid workspace dependencies.
#
# Versions mirror the Logic OS kernel workspace pins (the repo Braid was
# extracted from, ADR-088) so the two stay byte-compatible. Crates declare
# `{ workspace = true }`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# Shared workspace crate pins.
lgwks_std = { version = "0.5.1" }
# Content-addressed hash chain (BLAKE3 CIDs under lw.braid.*).
blake3 = { version = "1.8.5", default-features = false }

# The capability token newtype uses serde for canonical round-trip; no strum
# needed (D31: string-tagged capabilities replaced the kernel enum mirror).
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }

# Test-only.
proptest = "1.6.0"
serde_json = "1.0"

# Intra-workspace crates.
braid-capability = { path = "crates/braid-capability" }
braid-ir = { path = "crates/braid-ir" }
braid-flow-ir = { path = "crates/braid-flow-ir" }
braid-flow-verify = { path = "crates/braid-flow-verify" }
braid-vocab-cms = { path = "crates/braid-vocab-cms" }
braid-vocab-js = { path = "crates/braid-vocab-js" }
braid-verify = { path = "crates/braid-verify" }
braid-render = { path = "crates/braid-render" }
braid-sdk = { path = "crates/braid-sdk" }
braid-manifest = { path = "crates/braid-manifest" }
braid-runtime = { path = "crates/braid-runtime" }
braid-elaborate-dsl = { path = "crates/braid-elaborate-dsl" }

[patch.crates-io]
# While developing against the in-repo implementation, keep the public contract
# path (`lgwks_std = "0.3.0"`) while resolving to local source.
lgwks_std = { path = "crates/lgwks-std" }

[profile.release]
opt-level = 3
lto = true
