[workspace]
members = [
    "crates/braid-integrate",
    "crates/braid-capability",
    "crates/braid-ir",
    "crates/braid-flow-ir",
    "crates/braid-flow-verify",
    "crates/braid-flow-plan",
    "crates/braid-flow-sdk",
    "crates/braid-vocab-cms",
    "crates/braid-vocab-js",
    "crates/braid-vocab-web",
    "crates/braid-verify",
    "crates/braid-render",
    "crates/braid-sdk",
    "crates/braid-cli",
    "crates/braid-elaborate-dsl",
    "crates/braid-elaborate-js",
    "crates/braid-project",
    "crates/braid-runtime",
    "crates/braid-governance",
    "crates/braid-vocab-rust",
    "crates/braid-manifest",
    "crates/braid-run",
    "crates/braid-test-support",
]
resolver = "2"

# INV-NIGHTLY-ISOLATION — sandbox code may run on any toolchain it likes;
# keeping it out of the workspace keeps Cargo.lock and every member's
# rust-version honest at 1.98.
exclude = ["sandbox"]

# ─────────────────────────────────────────────────────────────────────────────
# Braid workspace dependencies.
#
# Versions mirror the Logic OS kernel workspace pins (the repo Braid was
# extracted from, ADR-088) so the two stay byte-compatible. Crates declare
# `{ workspace = true }`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# Shared workspace crate pins.
#
# All three resolve from crates.io; source of truth is
# https://github.com/srinji-kaggss/logicalworks-crates.
lgwks_std = { version = "0.5.2" }
# Content-addressed hash chain (BLAKE3 CIDs under lw.braid.*).
blake3 = { version = "1.8.5", default-features = false }

# The capability token newtype uses serde for canonical round-trip; no strum
# needed (D31: string-tagged capabilities replaced the kernel enum mirror).
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }

# Test-only.
proptest = "1.6.0"

# Intra-workspace crates.
braid-capability = { version = "0.1.0", path = "crates/braid-capability" }
braid-ir = { version = "0.1.0", path = "crates/braid-ir" }
braid-flow-ir = { version = "0.1.0", path = "crates/braid-flow-ir" }
braid-flow-verify = { version = "0.1.0", path = "crates/braid-flow-verify" }
braid-flow-plan = { version = "0.1.0", path = "crates/braid-flow-plan" }
braid-vocab-cms = { version = "0.1.0", path = "crates/braid-vocab-cms" }
braid-vocab-js = { version = "0.1.0", path = "crates/braid-vocab-js" }
braid-vocab-rust = { version = "0.1.0", path = "crates/braid-vocab-rust" }
braid-verify = { version = "0.1.0", path = "crates/braid-verify" }
braid-render = { version = "0.1.0", path = "crates/braid-render" }
braid-sdk = { version = "0.1.0", path = "crates/braid-sdk" }
braid-manifest = { version = "0.1.0", path = "crates/braid-manifest" }
braid-runtime = { version = "0.1.0", path = "crates/braid-runtime" }
braid-elaborate-dsl = { version = "0.1.0", path = "crates/braid-elaborate-dsl" }
braid-elaborate-js = { version = "0.1.0", path = "crates/braid-elaborate-js" }
braid-run = { version = "0.1.0", path = "crates/braid-run" }
braid-test-support = { version = "0.1.0", path = "crates/braid-test-support" }
lgwks_bot = { version = "0.1.2" }
lgwks_deps = { version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
