[workspace]
members = [
    "crates/braid-capability",
    "crates/braid-ir",
    "crates/braid-verify",
    "crates/braid-render",
    "crates/braid-sdk",
    "crates/braid-cli",
]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# Braid workspace dependencies.
#
# Versions mirror the Logic OS kernel workspace pins (the repo Braid was
# extracted from, ADR-088) so the two stay byte-compatible. Crates declare
# `{ workspace = true }`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# Content-addressed hash chain (BLAKE3 CIDs under lw.braid.*).
blake3 = "1.8.5"

# Vendored kernel capability contract (the D3 boundary; see
# crates/braid-capability). serde/strum deps mirror canvas-protocol's so the
# vendored Capability stays a verbatim mirror of origin/main.
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"

# Test-only.
hex = "0.4.3"
proptest = "1.6.0"

# Intra-workspace crates.
braid-capability = { path = "crates/braid-capability" }
braid-ir = { path = "crates/braid-ir" }
braid-verify = { path = "crates/braid-verify" }
braid-render = { path = "crates/braid-render" }

[profile.release]
opt-level = 3
lto = true
